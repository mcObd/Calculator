<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/calculatorstyles.css">
</head>
<body>
    <div class="wrapper">
        <section class="screen">
            0
        </section>

        <section class="btn-wrapper">
                <table>
                    <tr>
                        <td colspan="2">
                            <submit href="">C</submit>
                        </td>
                        <td>
                            <submit class="arrow"
                             href="">
                                <span>&#8592;</span>
                            </submit>
                        </td>
                        <td class="orange">
                            <submit class="white"
                            href="">
                                <span>&#247;</span>
                        </submit>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <submit href="">7</submit>
                        </td>
                        <td>
                            <submit href="">8</submit>
                        </td>
                        <td>
                            <submit href="">9</submit>
                        </td>
                        <td class="orange">
                            <submit class="white"
                            href="">
                                <span>&#215;</span>
                        </submit>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <submit href="">4</submit>
                        </td>
                        <td>
                            <submit href="">5</submit>
                        </td>
                        <td>
                            <submit href="">6</submit>
                        </td>
                        <td class="orange">
                            <submit class="white"
                            href="">
                                <span>&#8722;</span>
                        </submit>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <submit href="">1</submit>
                        </td>
                        <td>
                            <submit href="">2</submit>
                        </td>
                        <td>
                            <submit href="">3</submit>
                        </td>
                        <td class="orange">
                            <submit class="white"
                            href="">
                                <span>&#43;</span>
                        </submit>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <submit href="">0</submit>
                        </td>
                        <td class="orange">
                            <submit class="white"
                             href="">
                                <span>&#61;</span>

                        </submit>
                        </td>
                    </tr>
                </table>
        </section>
    </div>
    <br>
    <br><br><br><br><br><br><br>


    

     <div class="wrapper">
        <section class="screen">
        0
        </section>
    
        <section class="calc-buttons">
            <div class="calc-button-row">
                <button class="calc-button double ">C</button>
                <button class="calc-button">&larr;</button>
                <button class="calc-button">&divide;</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button">7</button>
                <button class="calc-button">8</button>
                <button class="calc-button">9</button>
                <button class="calc-button">&times;</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button">4</button>
                <button class="calc-button">5</button>
                <button class="calc-button">6</button>
                <button class="calc-button">-</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button">1</button>
                <button class="calc-button">2</button>
                <button class="calc-button">3</button>
                <button class="calc-button">&plus;</button>
            </div>
            <div class="calc-button-row">
                <button class="calc-button triple">0</button>
                <button class="calc-button">&equals;</button>
            </div>
        </section>
    </div>
    
</body>
</html>
