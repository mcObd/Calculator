<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>Simple Calculator | McQuendie</title>
  <meta name="title" content="Simple Calculator | McQuendie">
  <meta name="description" content="A beautiful, responsive calculator with modern design and smooth animations. Built with HTML and CSS for optimal performance.">
  <meta name="keywords" content="calculator, web calculator, responsive calculator, HTML calculator, CSS calculator, mcquendie, web development, frontend design">
  <meta name="author" content="McQuendie">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-domain.com/calculator">
  <meta property="og:title" content="Simple Calculator | McQuendie">
  <meta property="og:description" content="A beautiful, responsive calculator with modern design and smooth animations.">
  <meta property="og:image" content="https://your-domain.com/calculator-preview.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://your-domain.com/calculator">
  <meta name="twitter:title" content="Simple Calculator | McQuendie">
  <meta name="twitter:description" content="A beautiful, responsive calculator with modern design and smooth animations.">
  <meta name="twitter:image" content="https://your-domain.com/calculator-preview.jpg">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://your-domain.com/calculator">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Simple Calculator",
    "description": "A beautiful, responsive calculator with modern design",
    "author": {
      "@type": "Person",
      "name": "McQuendie"
    },
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "Any",
    "url": "https://your-domain.com/calculator"
  }
  </script>
</head>
<body>
  <div class="calculator-container">
    <div class="calculator">
      <div class="calculator-header">
        <h1>Calculator</h1>
        <p>by McQuendie</p>
      </div>
      
      <div class="display">
        <div class="previous-operand">0</div>
        <div class="current-operand">0</div>
      </div>
      
      <div class="buttons">
        <button class="btn operator" data-action="clear">AC</button>
        <button class="btn operator" data-action="delete">DEL</button>
        <button class="btn operator" data-action="percent">%</button>
        <button class="btn operator" data-action="divide">÷</button>
        
        <button class="btn number" data-number="7">7</button>
        <button class="btn number" data-number="8">8</button>
        <button class="btn number" data-number="9">9</button>
        <button class="btn operator" data-action="multiply">×</button>
        
        <button class="btn number" data-number="4">4</button>
        <button class="btn number" data-number="5">5</button>
        <button class="btn number" data-number="6">6</button>
        <button class="btn operator" data-action="subtract">−</button>
        
        <button class="btn number" data-number="1">1</button>
        <button class="btn number" data-number="2">2</button>
        <button class="btn number" data-number="3">3</button>
        <button class="btn operator" data-action="add">+</button>
        
        <button class="btn number" data-number="0">0</button>
        <button class="btn number" data-number=".">.</button>
        <button class="btn equals" data-action="equals">=</button>
      </div>
    </div>
  </div>
</body>
</html>
